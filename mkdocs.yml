site_name: todo

# TechDocs config. Backstage renders these pages inline on the app's Docs tab
# (see backstage.io/techdocs-ref in catalog-info.yaml). Written for the app's
# owner — plain language, not developers.
plugins:
  - techdocs-core

# docs/ai-tasks/ (the AI's task board / project memory) is deliberately NOT
# in the nav — it's internal working state, not owner documentation.
nav:
  - What is todo?: index.md
  - How it works: how-it-works.md
  - Using your app: using-your-app.md
  - Google sign-in setup: google-signin-setup.md
  - Developing with AI: developing-with-ai.md
